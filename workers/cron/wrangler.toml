# pvuv.ai cron worker — scheduled jobs  (PROJECT_PLAN.md §2, §6.3–§6.4, §18.4)
#   Hourly:  rollup pre-aggregation (page/source/site daily, clean bucket)
#            + session-layer re-verdict
#   Daily:   population batch analysis + blocklist refresh + retention purge
#
# All ids are PLACEHOLDERS — see root wrangler.toml for security notes.

name = "pvuv-cron"
main = "src/index.ts"
compatibility_date = "2026-06-01"
account_id = "0a9b110b9b2a824a62004210f7d21a2b"

# KV: daily job writes confirmed clusters to the blocklist
# (top-level key — must stay above the first [table] header)
kv_namespaces = [
  { binding = "BLOCKLIST", id = "9a3c7fb92e3d45028b18b1ffc58725e9" }
]

# DO NOT EDIT THESE IN THE CLOUDFLARE DASHBOARD.
# The dashboard's cron editor is an "every N minutes/hours" builder that cannot
# represent a daily-at-a-fixed-time schedule, so merely OPENING the trigger and
# saving rewrites "30 3 * * *" into the nearest preset it can express. Wrangler
# does not reconcile that back, and src/index.ts dispatches on the exact string,
# so the daily batch then silently never runs. Change them here and redeploy.
# If they have already drifted: delete both triggers in the dashboard, then
# `npm run deploy:cron` to have wrangler recreate them from this file.
[triggers]
crons = [
  "5 * * * *",   # hourly rollup (at :05, after the hour closes)
  "30 3 * * *"   # daily population/batch analysis + retention
]

[[d1_databases]]
binding = "DB"
database_name = "pvuv-db"
database_id = "062e5d96-f650-44bb-ac94-fe42f71a940c"

[observability]
enabled = true
